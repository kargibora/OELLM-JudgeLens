name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PREFSCOPE_DATA_RELEASE: viewer-data-m2048-signed-coactivation-2026-08-31
  PREFSCOPE_DATA_ASSET: completion_m2048-public.tar.gz
  DOLCI_VIEWER_RELEASE: dolci-prompt256-response512-reviewed-v3
  DOLCI_VIEWER_ASSET: dolci-prompt256-response512-viewer.zip
  DOLCI_VIEWER_SHA256: feef5ec3a4ddd9ac91783e7708cd304975ba40a55aa0f5d712b945aa22c595ab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download the versioned public analysis bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf public/data public/runs
          mkdir -p public/runs
          gh release download "$PREFSCOPE_DATA_RELEASE" \
            --pattern "$PREFSCOPE_DATA_ASSET" \
            --dir /tmp
          tar -xzf "/tmp/$PREFSCOPE_DATA_ASSET" -C public/runs
      - run: npm ci
      - run: npm run test:bundle
      - name: Build the viewer
        env:
          VITE_PREFSCOPE_DATA_URL: ./runs/completion_m2048/
        run: npm run build
      - name: Include the reviewed Dolci Viewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DOLCI_VIEWER_RELEASE" \
            --pattern "$DOLCI_VIEWER_ASSET" --dir "$RUNNER_TEMP"
          echo "$DOLCI_VIEWER_SHA256  $RUNNER_TEMP/$DOLCI_VIEWER_ASSET" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$DOLCI_VIEWER_ASSET" -d "$RUNNER_TEMP/dolci-viewer"
          mkdir -p dist/dolci dist/dolci-prompt256-response512-viewer
          cp -a "$RUNNER_TEMP/dolci-viewer/site/." dist/dolci/
          cp scripts/dolci-redirect.html dist/dolci-prompt256-response512-viewer/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
